name: Check Bloom

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Enforce direct transport boundary
        run: |
          if cargo tree -p bloomd -e normal --prefix none | grep -q '^rustpush '; then
            echo 'rustpush must not enter the default bloomd dependency graph'
            exit 1
          fi
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  engine-sidecar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ext/bloom-engine-sidecar/dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve dependencies
        run: dart pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed bin lib/payload_codec.dart lib/protocol.dart test
      - name: Analyze
        run: dart analyze bin lib/payload_codec.dart lib/protocol.dart test
      - name: Tests
        run: dart test
      - name: Engine stays out of the repository
        run: |
          if find . -name '*.so' -o -name 'librust_lib_bluebubbles*' | grep -q .; then
            echo 'the engine binary must never be vendored into this repository'
            exit 1
          fi
