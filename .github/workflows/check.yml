name: Check Bloom

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: No emptied or stubbed sources
        run: ./scripts/check-sources
      - name: Third-party notice bundle
        run: python3 scripts/test-third-party-notices.py
      - name: Refresh bindings helper
        run: python3 scripts/test-refresh-bindings.py

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Keep in sync with rust-toolchain.toml; bump deliberately after verification.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Enforce direct transport boundary
        run: |
          if cargo tree -p bloomd -e normal --prefix none | grep -q '^rustpush '; then
            echo 'rustpush must not enter the default bloomd dependency graph'
            exit 1
          fi
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --workspace --all-targets
        env:
          TZ: UTC
      - name: Real-terminal messaging regressions (synthetic accounts only)
        run: |
          cargo build -p bloom-tui
          python3 -m venv "$RUNNER_TEMP/bloom-e2e"
          "$RUNNER_TEMP/bloom-e2e/bin/pip" install pyte==0.8.2
          "$RUNNER_TEMP/bloom-e2e/bin/python" scripts/test-launcher-e2e.py
          "$RUNNER_TEMP/bloom-e2e/bin/python" scripts/test-stateful-fake-daemon.py
          "$RUNNER_TEMP/bloom-e2e/bin/python" scripts/test-tui-input-e2e.py
          "$RUNNER_TEMP/bloom-e2e/bin/python" scripts/test-tui-messaging-e2e.py
          "$RUNNER_TEMP/bloom-e2e/bin/python" scripts/test-tui-reading-e2e.py
        env:
          TZ: UTC
      - name: TUI tests under a second timezone
        run: cargo test -p bloom-tui
        env:
          TZ: Asia/Tokyo
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  engine-sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ext/bloom-engine-sidecar/dart
    steps:
      - uses: actions/checkout@v5
      # Keep in sync with rust-toolchain.toml; bump deliberately after verification.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - name: Resolve dependencies
        run: dart pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed bin lib/attachment_cache.dart lib/attachment_send.dart lib/engine_preflight.dart lib/payload_codec.dart lib/protocol.dart lib/single_flight.dart test tool
      - name: Analyze
        run: dart analyze bin lib/attachment_cache.dart lib/attachment_send.dart lib/engine_preflight.dart lib/payload_codec.dart lib/protocol.dart lib/single_flight.dart test tool
      - name: Tests
        run: dart test
      - name: Engine stays out of the repository
        run: |
          if find . -name '*.so' -o -name 'librust_lib_bluebubbles*' | grep -q .; then
            echo 'the engine binary must never be vendored into this repository'
            exit 1
          fi
