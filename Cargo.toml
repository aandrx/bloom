[workspace]
resolver = "2"
members = [
    "crates/bloom-core",
    "crates/bloom-domain",
    "crates/bloom-secrets",
    "crates/bloom-ipc",
    "crates/bloom-transport",
    "apps/bloomd",
    "apps/bloom-tui",
]
exclude = ["spike/matrix"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[profile.demo]
# Demo mode ships the same optimized binaries as a release build, but keeps its
# outputs under target/demo so a demo build cannot be mistaken for a release.
inherits = "release"

[workspace.dependencies]
anyhow = "1"
keyring = { version = "4.2.0", default-features = true }
matrix-sdk = { version = "=0.19.1", default-features = true, features = ["e2e-encryption", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
