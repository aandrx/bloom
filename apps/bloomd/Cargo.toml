[package]
name = "bloomd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "rt-multi-thread", "macros", "process", "io-util", "signal"] }
libc = "0.2"
bloom-ipc = { path = "../../crates/bloom-ipc" }
bloom-domain = { path = "../../crates/bloom-domain" }
bloom-transport = { path = "../../crates/bloom-transport" }
bloom-secrets = { path = "../../crates/bloom-secrets" }
serde_json = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = "1"
unicode-segmentation = "1"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
